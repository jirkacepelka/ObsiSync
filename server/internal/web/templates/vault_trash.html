{{define "content"}}
{{template "vaultnav" .}}
{{$v := .Vault}}
<p class="muted">{{$.T "trash.hint"}}</p>
<table>
  <thead><tr><th>{{$.T "col.file"}}</th><th>{{$.T "col.deleted"}}</th></tr></thead>
  <tbody>
  {{range index .D "Files"}}
    <tr><td><a href="/vaults/{{$v.ID}}/file?path={{q .Path}}">{{.Path}}</a></td><td>{{$.Date (ms .Mtime)}}</td></tr>
  {{else}}
    <tr><td colspan="2" class="muted">{{$.T "trash.empty"}}</td></tr>
  {{end}}
  </tbody>
</table>
{{end}}
