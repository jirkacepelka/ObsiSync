{{define "content"}}
{{template "vaultnav" .}}
{{$v := .Vault}}
<form method="post" action="/vaults/{{$v.ID}}/settings" class="card">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">
  <label>{{$.T "field.vaultName"}} <input name="name" value="{{$v.Name}}" required maxlength="100"></label>
  <h2>{{$.T "tab.backups"}}</h2>
  {{template "backupfields" (dict "P" $ "Interval" $v.Backup.IntervalSec "Retention" $v.Backup.RetentionDays "Zip" $v.Backup.Zip)}}
  <button class="primary">{{$.T "action.save"}}</button>
</form>
<form method="post" action="/vaults/{{$v.ID}}/delete" class="card danger-zone">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">
  <h2>{{$.T "vaultSettings.delete"}}</h2>
  <p>{{$.T "vaultSettings.deleteHint"}}</p>
  <label>{{$.T "vaultSettings.confirm"}} <b>{{$v.Name}}</b> <input name="confirm" required autocomplete="off"></label>
  <button class="danger">{{$.T "vaultSettings.delete"}}</button>
</form>
{{end}}
