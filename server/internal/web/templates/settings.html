{{define "content"}}
<h1>{{$.T "title.serverSettings"}}</h1>
{{$s := index .D "S"}}
<form method="post" action="/settings" class="card">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">
  <div class="grid2">
    <label>{{$.T "settings.versionRetention"}}
      <input type="number" name="version_retention_days" min="0" value="{{$s.VersionRetentionDays}}"></label>
    <label>{{$.T "settings.maxFile"}}
      <input type="number" name="max_file_mb" min="1" max="10240" value="{{$s.MaxFileMB}}"></label>
  </div>
  <label class="check"><input type="checkbox" name="users_can_create_vaults" value="1" {{if $s.UsersCanCreateVaults}}checked{{end}}> {{$.T "settings.usersCanCreate"}}</label>
  <p class="muted">{{$.T "settings.defaultsHint"}}</p>
  <button class="primary">{{$.T "action.save"}}</button>
</form>
{{end}}
