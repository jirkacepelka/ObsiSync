# Simple Sync – the simplest setup (home network, NAS, ZimaOS over SSH).
# Start:  docker compose up -d   → then open http://<server-ip>:8080
services:
  obsisync:
    image: ghcr.io/jirkacepelka/obsisync:latest
    container_name: obsisync
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Prague
    volumes:
      - ./data:/data
