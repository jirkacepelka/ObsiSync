# SimpleSync on a VPS with automatic HTTPS (Let's Encrypt via Caddy).
# 1) Point a DNS A record (e.g. sync.example.com) at the VPS IP address.
# 2) DOMAIN=sync.example.com docker compose -f docker-compose.caddy.yml up -d
# 3) Open https://sync.example.com and create the administrator.
services:
  obsisync:
    image: ghcr.io/jirkacepelka/obsisync:latest
    restart: unless-stopped
    environment:
      - TZ=Europe/Prague
    volumes:
      - ./data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:?Set DOMAIN, e.g. DOMAIN=sync.example.com}
    command: caddy reverse-proxy --from ${DOMAIN} --to obsisync:8080
    volumes:
      - ./caddy:/data
