# Simple Sync for ZimaOS / CasaOS – the setup verified on ZimaOS.
# App Store → "+" (Install a customized app) → YAML → paste this file → Install.
# Then open http://<zimaos-ip>:8080 and create the administrator.
# Data (database, files, backups) is kept in /DATA/AppData/obsisync/data.
name: obsisync
services:
  obsisync:
    image: ghcr.io/jirkacepelka/obsisync:latest
    container_name: obsisync
    restart: unless-stopped
    ports:
      - target: 8080
        published: "8080"
        protocol: tcp
    environment:
      TZ: Europe/Prague
    volumes:
      - type: bind
        source: /DATA/AppData/obsisync/data
        target: /data
x-casaos:
  architectures:
    - amd64
    - arm64
  main: obsisync
  category: Utilities
  title:
    en_us: Simple Sync
  tagline:
    en_us: Simple self-hosted sync for Obsidian
  icon: https://raw.githubusercontent.com/jirkacepelka/ObsiSync/main/server/internal/web/static/icon.svg
  index: /
  port_map: "8080"
  scheme: http
