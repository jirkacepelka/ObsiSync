name: Release

# Every push to main publishes the Docker image (tags "latest" and the plugin
# version) and a GitHub release <version> with the plugin files. The release
# description is that version's section in CHANGELOG.md.
# Bump the version in manifest.json and plugin/manifest.json to release anew.
on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/obsisync
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build plugin
        working-directory: plugin
        run: |
          npm ci
          node esbuild.config.mjs production
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            plugin/dist/main.js
            plugin/dist/manifest.json
            plugin/dist/styles.css
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "SimpleSync $VERSION. See the [README](https://github.com/${{ github.repository }}#readme) for setup." > release-notes.md
          fi
          cat release-notes.md
      - name: GitHub release (assets used by Obsidian, BRAT and manual install)
        uses: softprops/action-gh-release@v2
        with:
          # Obsidian requires the tag to equal the manifest version (no "v").
          tag_name: ${{ steps.version.outputs.version }}
          name: SimpleSync ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: release-notes.md
          files: |
            plugin/dist/main.js
            plugin/dist/manifest.json
            plugin/dist/styles.css
